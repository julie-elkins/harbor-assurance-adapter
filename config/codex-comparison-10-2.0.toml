[run]
benchmark = "terminal-bench"
benchmark_revision = "2.0"
agent = "codex"
agent_revision = "0.167.0"
model = "openai/gpt-5.5"
provider = "openai"
harness = "harbor"
harness_revision = "v0.9.0"
pass_env = ["OPENAI_API_KEY"]
path_prefix = "bin"
workdir = "."
raw_run_dir = "runs"

[budget]
max_total_cost_usd = 150.0
estimated_cost_per_task_usd = 10.0
task_count = 10
attempts = 1
timeout_seconds = 21600
max_output_bytes = 1048576
stop_condition = "stop-after-ten-tasks-or-any-timeout-or-output-cap"

[command]
argv = [
  "harbor",
  "run",
  "--dataset",
  "terminal-bench@2.0",
  "--include-task-name",
  "fix-git",
  "--include-task-name",
  "cobol-modernization",
  "--include-task-name",
  "regex-log",
  "--include-task-name",
  "sanitize-git-repo",
  "--include-task-name",
  "break-filter-js-from-html",
  "--include-task-name",
  "kv-store-grpc",
  "--include-task-name",
  "qemu-startup",
  "--include-task-name",
  "raman-fitting",
  "--include-task-name",
  "fix-code-vulnerability",
  "--include-task-name",
  "gpt2-codegolf",
  "--agent",
  "codex",
  "--model",
  "openai/gpt-5.5",
  "--agent-kwarg",
  "version=0.167.0",
  "--agent-kwarg",
  "reasoning_effort=high",
  "--n-tasks",
  "10",
  "--n-attempts",
  "1",
  "--n-concurrent",
  "1",
  "--agent-timeout-multiplier",
  "4",
  "--env",
  "docker",
  "--environment-import-path",
  "harbor_assurance_adapter.harbor_environment:CredentialSafeDockerEnvironment",
]
