[run]
benchmark = "terminal-bench"
benchmark_revision = "2.0"
agent = "codex"
agent_revision = "0.167.0"
model = "openai/gpt-5.5"
provider = "openai"
harness = "harbor"
harness_revision = "v0.9.0"
pass_env = ["OPENAI_API_KEY"]
path_prefix = "bin"
workdir = "."
raw_run_dir = "runs"

[budget]
max_total_cost_usd = 25.0
estimated_cost_per_task_usd = 8.0
task_count = 1
attempts = 1
timeout_seconds = 3600
max_output_bytes = 262144
stop_condition = "stop-after-one-task-or-any-timeout-or-output-cap"

[command]
argv = [
  "harbor",
  "run",
  "--dataset",
  "terminal-bench@2.0",
  "--include-task-name",
  "sanitize-git-repo",
  "--agent",
  "codex",
  "--model",
  "openai/gpt-5.5",
  "--agent-kwarg",
  "version=0.167.0",
  "--agent-kwarg",
  "reasoning_effort=high",
  "--n-tasks",
  "1",
  "--n-attempts",
  "1",
  "--n-concurrent",
  "1",
  "--agent-timeout-multiplier",
  "4",
  "--env",
  "docker",
  "--environment-import-path",
  "harbor_assurance_adapter.harbor_environment:CredentialSafeDockerEnvironment",
]
