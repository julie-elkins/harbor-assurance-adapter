name: Reproducibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Regenerate offline cohort report
        run: |
          uv run harbor-assurance compare-cohorts \
            --manifest docs/cohort-comparison.toml \
            --output /tmp/cohort-comparison-v1.json

      - name: Check report is deterministic
        run: cmp --silent /tmp/cohort-comparison-v1.json docs/results/cohort-comparison-v1.json
